<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Platform</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ==========================================================================
           1. BASE STYLES & RESETS
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            background-color: #f9f9f9;
            color: #333;
            height: 100%;
            overflow: hidden; 
        }

        /* ==========================================================================
           2. TOP NAVIGATION BAR
           ========================================================================== */
        .topnav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .topnav-left, .topnav-right {
            display: flex;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            text-decoration: none;
            color: #2b2b2b;
            font-size: 1.1rem;
            margin-left: 15px;
        }

        .course-selector {
            text-decoration: none;
            color: #555;
            padding: 18px 16px;
            display: inline-block;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .course-selector:hover, .course-selector.active {
            background-color: #04AA6D; 
            color: white;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #333;
            display: none; 
            padding: 8px;
        }

        /* ==========================================================================
           3. LEFT SIDE INDEX NAVIGATION
           ========================================================================== */
        .sidebar {
            position: fixed;
            top: 60px; 
            left: 0;
            width: 260px;
            height: calc(100vh - 60px);
            background-color: #f1f1f1;
            overflow-y: auto; 
            padding-top: 15px;
            z-index: 999;
            display: none; 
        }

        .sidebar.active {
            display: block; 
        }

        .sidebar-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #666;
            background-color: #e4e4e4;
            padding: 10px 20px;
            margin-top: 10px;
            display: block;
        }

        .sidebar-category:first-of-type {
            margin-top: 0;
        }

        .sidebar a {
            display: block; 
            color: #333;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .sidebar a:hover {
            background-color: #ddd;
        }

        .sidebar a.active {
            background-color: #ffffff;
            color: #04AA6D;
            font-weight: 600;
            border-left-color: #04AA6D;
        }

        /* ==========================================================================
           4. MAIN CONTENT PANEL AREA
           ========================================================================== */
        .content {
            margin-top: 60px;   
            margin-left: 260px; 
            height: calc(100vh - 60px);
            display: block;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* ==========================================================================
           5. RESPONSIVE MEDIA QUERIES
           ========================================================================== */
        @media screen and (max-width: 992px) {
            .menu-btn {
                display: block; 
            }

            .sidebar {
                transform: translateX(-100%); 
                transition: transform 0.3s ease;
            }

            .content {
                margin-left: 0; 
            }

            .sidebar.active.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <header class="topnav">
        <div class="topnav-left">
            <button id="menu-toggle" class="menu-btn"><i class="fas fa-bars"></i></button>
            <span class="logo">Academy Platform</span>
        </div>
        <div class="topnav-right">
            <a class="course-selector active" data-target="aiaccelerator-course">AI Accelerator</a>
            <a class="course-selector" data-target="introtoai-course">Introduction to AI</a>
        </div>
    </header>

    <nav id="aiaccelerator-course" class="sidebar active">
        <div class="sidebar-category">Module 1: Basic elements</div>
        <a href="./AIAccelerator/Pages/Documents.html" target="course-view" class="sidebar-link active">1.2. Document templates</a>
        <a href="./AIAccelerator/Pages/SOPs.html" target="course-view" class="sidebar-link active">1.3. SOPs</a>
        <a href="./AIAccelerator/Pages/DocWithSOP.html" target="course-view" class="sidebar-link active">1.4 Document Templates with Embedded SOPs</a>
        <a href="./AIAccelerator/Pages/CustomAIAssistants.html" target="course-view" class="sidebar-link active">1.5 Custom AI Assistants</a>        
        <a href="./AIAccelerator/Pages/ReferenceMaterials.html" target="course-view" class="sidebar-link active">1.6 Reference Materials</a>
        <div class="sidebar-category">Module 2: </div>
               
        <div class="sidebar-category">Module 3:</div>


        
    </nav>

    <nav id="introtoai-course" class="sidebar">
        <div class="sidebar-category">Module 1: Foundations</div>
        <a href="./IntroToAI/Pages/Prompts.html" target="course-view" class="sidebar-link active">1.1. Anatomy of a prompt</a>

        <div class="sidebar-category">Module 2: </div>

    </nav>

    <main id="main-content" class="content">
        <iframe name="course-view" id="course-view" class="content-frame" srcdoc="
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { font-family: 'Segoe UI', sans-serif; padding: 40px; color: #333; background: #f9f9f9; }
                    .container { max-width: 850px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
                    h1 { font-size: 2rem; margin-bottom: 15px; color: #111827; border-bottom: 2px solid #f1f1f1; padding-bottom: 10px; }
                    p { margin: 15px 0; line-height: 1.6; font-size: 1.05rem; color: #374151; }
                </style>
            </head>
            <body>
                <div class='container'>
                    <h1>Welcome to your Courses</h1>
                    <p>Please select a lesson module from the left menu index sidebar.</p>
                </div>
            </body>
            </html>
        "></iframe>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuToggle = document.getElementById("menu-toggle");
            const courseSelectors = document.querySelectorAll(".course-selector");
            const sidebars = document.querySelectorAll(".sidebar");
            const sidebarLinks = document.querySelectorAll(".sidebar-link");
            const courseView = document.getElementById("course-view");

            // 1. TOP MENU SWITCHER SYSTEM
            courseSelectors.forEach(selector => {
                selector.addEventListener("click", function() {
                    courseSelectors.forEach(item => item.classList.remove("active"));
                    this.classList.add("active");

                    const targetCourseId = this.getAttribute("data-target");
                    sidebars.forEach(sidebar => sidebar.classList.remove("active", "open"));
                    
                    const activeSidebar = document.getElementById(targetCourseId);
                    activeSidebar.classList.add("active");

                    sidebarLinks.forEach(link => link.classList.remove("active"));
                    const firstLink = activeSidebar.querySelector(".sidebar-link");
                    if (firstLink) {
                        firstLink.classList.add("active");
                        courseView.src = firstLink.getAttribute("href");
                    }
                });
            });

            // 2. SIDEBAR INTERNAL LINK STATE SELECTIONS
            sidebarLinks.forEach(link => {
                link.addEventListener("click", function() {
                    sidebarLinks.forEach(item => item.classList.remove("active"));
                    this.classList.add("active");
                    sidebars.forEach(sidebar => sidebar.classList.remove("open"));
                });
            });

            // 3. RESPONSIVE MOBILE DRAWERS
            menuToggle.addEventListener("click", function (event) {
                const currentActiveSidebar = document.querySelector(".sidebar.active");
                if (currentActiveSidebar) {
                    currentActiveSidebar.classList.toggle("open");
                }
                event.stopPropagation();
            });

            document.addEventListener("click", function (event) {
                const currentActiveSidebar = document.querySelector(".sidebar.active");
                if (currentActiveSidebar && !currentActiveSidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                    currentActiveSidebar.classList.remove("open");
                }
            });
        });
    </script>
</body>
</html>
